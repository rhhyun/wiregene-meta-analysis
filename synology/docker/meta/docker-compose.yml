version: "3.3"
services:
  meta:
    image: ${META_IMAGE:-ghcr.io/rhhyun/wiregene-meta-analysis:main}
    container_name: ${CONTAINER_NAME:-wiregene-meta}
    restart: "on-failure:3"
    ports:
      - "${HOST_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      WIREGENE_APP_MODE: meta
      PORT: "3000"
      REPORT_STORAGE_BACKEND: ${REPORT_STORAGE_BACKEND:-local-json}
      REPORT_STORAGE_LOCAL_PATH: ${REPORT_STORAGE_LOCAL_PATH:-download/_system/research-briefing-storage.json}
    volumes:
      - ./data:/app/.data/meta
      - ./download:/app/download
      - ./logs:/app/.logs/meta
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status === 200 ? 0 : 1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
